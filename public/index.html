<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
    <style>
      body {
        transition: background-color 0.3s ease-in-out;
      }
      .dark-mode-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        cursor: pointer;
      }
      .dark-mode-toggle .button {
        color: #fff;
      }
      .dark-mode-toggle .button.dark {
        color: #000;
      }
      .login-form {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        padding: 20px;
        background-color: #f0f0f0;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }
      .error-message {
        color: red;
        font-size: 14px;
        margin-top: 10px;
      }
      .theme-toggle-switch {
        position: relative;
        width: 60px;
        height: 30px;
        border-radius: 30px;
        background-color: #c0c0c0;
        transition: background-color 0.3s ease-in-out, border-color 0.3s ease-in-out;
      }
      .theme-toggle-switch span {
        position: absolute;
        left: 0;
        top: 0;
        height: 60%;
        width: 60%;
        background-color: #ccc;
        border-radius: 30px;
        transition: background-color 0.3s ease-in-out;
      }
      .theme-toggle-switch .dark span {
        background-color: #000;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">
      <span class="button"> Toggle Dark Mode </span>
    </button>
    <div class="dark-mode-container">
      <input type="checkbox" id="dark-mode-checkbox" hidden />
      <label for="dark-mode-checkbox">
        <div class="theme-toggle-switch">
          <span></span>
        </div>
      </label>
    </div>
    <div class="login-form">
      <h2>Login Form</h2>
      <form id="login-form">
        <label for="username">Username:</label>
        <br>
        <input type="text" id="username" name="username" required>
        <br>
        <label for="password">Password:</label>
        <br>
        <input type="password" id="password" name="password" required>
        <br>
        <button type="submit">Login</button>
      </form>
      <p class="error-message" id="error-message"></p>
    </div>
    <div id="root"></div>
    <script>
      function toggleDarkMode() {
        const body = document.body;
        const checkbox = document.getElementById('dark-mode-checkbox');
        const darkModeContainer = document.querySelector('.dark-mode-container');
        darkModeContainer.classList.toggle('active');

        if (checkbox.checked) {
          body.classList.add('dark-mode');
        } else {
          body.classList.remove('dark-mode');
        }
      }
      function checkDarkModePreference() {
        const darkModePreference = window.localStorage.getItem('darkMode');
        if (darkModePreference === 'true') {
          document.body.classList.add('dark-mode');
          document.querySelector('.dark-mode-container').classList.add('active');
          document.getElementById('dark-mode-checkbox').checked = true;
        }
      }
      checkDarkModePreference();

      document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('login-form');
        form.addEventListener('submit', function(event) {
          event.preventDefault();
          const username = document.getElementById('username').value;
          const password = document.getElementById('password').value;
          // API or backend call to check username and password
          if (username === 'test' && password === 'test') {
            alert('Login successful!');
          } else {
            document.getElementById('error-message').textContent = 'Invalid username or password';
          }
        });
      });

      document.addEventListener('click', () => {
        const body = document.body;
        const checkbox = document.getElementById('dark-mode-checkbox');
        if (document.querySelector('.dark-mode-container').classList.contains('active')) {
          body.classList.toggle('dark-mode');
        }
      });
    </script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
