<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
    <meta
      name="color-scheme"
      content="light dark"
    />
    <meta
      name="supported-color-schemes"
      content="light dark"
    />
    <meta
      name="theme-color"
      content="#ffffff"
    />
    <style>
      #theme-toggle {
        position: fixed;
        top: 10px;
        right: 10px;
      }
      .active {
        background-color: black;
        color: white;
      }
      .inactive {
        background-color: white;
        color: black;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <button id="theme-toggle" class="inactive">
      Toggle Dark Light Mode
    </button>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@2/src/js.cookie.min.js"></script>
    <script>
      const themeToggle = document.getElementById('theme-toggle');
      themeToggle.addEventListener('click', () => {
        if (document.body.classList.contains('dark')) {
          document.body.classList.remove('dark');
          document.body.classList.add('light');
          Cookies.remove('theme');
          Cookies.set('theme', 'light', { expires: 9999 });
          themeToggle.classList.remove('active');
          themeToggle.classList.add('inactive');
        } else {
          document.body.classList.remove('light');
          document.body.classList.add('dark');
          Cookies.remove('theme');
          Cookies.set('theme', 'dark', { expires: 9999 });
          themeToggle.classList.remove('inactive');
          themeToggle.classList.add('active');
        }
      });
      if (Cookies.get('theme') === 'dark') {
        document.body.classList.add('dark');
        document.body.classList.remove('light');
        themeToggle.classList.remove('inactive');
        themeToggle.classList.add('active');
      } else if (Cookies.get('theme') === 'light') {
        document.body.classList.remove('dark');
        document.body.classList.add('light');
        themeToggle.classList.remove('active');
        themeToggle.classList.add('inactive');
      } else {
        document.body.classList.add('light');
        themeToggle.classList.remove('inactive');
        themeToggle.classList.add('active');
      }
    </script>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
